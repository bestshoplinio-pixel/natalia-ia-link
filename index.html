<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natalia IA — Cuerpo y Mente</title>
<style>
html,body{margin:0;height:100%;background:#0b1016;font:15px system-ui,sans-serif;color:#9fb3c8}
#marco{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#estado{position:fixed;bottom:8px;right:10px;background:#151e28;border:1px solid #27384a;border-radius:8px;padding:5px 10px;font-size:11px;opacity:.75}
</style>
</head>
<body>
<iframe id="marco" title="Cuerpo y Mente" allow="clipboard-write"></iframe>
<div id="estado">Conectando…</div>
<script>
async function cargar(){
  const e=document.getElementById('estado');
  try{
    const r=await fetch('url.json?t='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    if(!d.url) throw new Error('sin URL');
    document.getElementById('marco').src=d.url;
    e.textContent='Conectado';
  }catch(err){
    e.textContent='Reintentando…';
    setTimeout(cargar,5000);
  }
}
cargar();
</script>
</body>
</html>
